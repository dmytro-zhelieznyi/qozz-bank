openapi: 3.1.1
info:
  title: QozzBank API
  description: >
    Core Banking System API. 
    This document defines the contract between the server and clients.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: home
    description: General service information

paths:
  /:
    get:
      tags:
        - home
      summary: Get service summary
      description: Returns basic metadata about the QozzBank service.
      operationId: getHomeInfo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeInfoResponse'

components:
  schemas:
    HomeInfoResponse:
      type: object
      required: [ message ]
      properties:
        message:
          type: string
          example: "Welcome to QozzBank API"
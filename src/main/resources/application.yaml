server:
  port: 8080

spring:
  application:
    name: QozzBank
  # Enable Virtual Threads for high-throughput request processing
  threads:
    virtual:
      enabled: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Spring Boot Actuator: Internal monitoring and system status
management:
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
    build:
      enabled: true
    git:
      mode: full
  endpoints:
    web:
      base-path: /actuator
      exposure:
        # Explicitly listing critical endpoints for bank monitoring
        include: [ "health", "info", "metrics", "prometheus", "loggers" ]
  endpoint:
    health:
      # Show detailed status of DB, Disk, and Flyway
      show-details: always
      probes:
        enabled: true
  health:
    db:
      enabled: true
    flyway:
      enabled: true


# Custom application info for /actuator/info
info:
  app:
    name: ${spring.application.name}
    description: "High-performance Core Banking System"
    version: "1.0.0"
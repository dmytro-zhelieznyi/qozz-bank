server:
  port: 8080

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    url: /api/openapi.yaml
    disable-swagger-default-url: true

spring:
  application:
    name: QozzBank
  # Enable Virtual Threads for high-throughput request processing
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://qozzbank-db:5432/qozzbank
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  rabbitmq:
    host: qozzbank-rabbitmq
    port: 5672
    username: guest
    password: guest

# Spring Boot Actuator: Internal monitoring and system status
management:
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
    build:
      enabled: true
    git:
      mode: full
  endpoints:
    web:
      base-path: /actuator
      exposure:
        # Explicitly listing critical endpoints for bank monitoring
        include: [ "health", "info", "metrics", "prometheus", "loggers" ]
  endpoint:
    health:
      # Show detailed status of DB, Disk, and Flyway
      show-details: always
      probes:
        enabled: true
  health:
    db:
      enabled: true
    flyway:
      enabled: true

# Custom application info for /actuator/info
info:
  app:
    name: ${spring.application.name}
    description: "High-performance Core Banking System"
    version: "1.0.0"

logging:
  level:
    root: INFO
    io.qozz.qozzbank: INFO # Поправил пакет на твой io.qozz
    org.hibernate.SQL: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%25.25thread] %logger{36}: %msg%n"